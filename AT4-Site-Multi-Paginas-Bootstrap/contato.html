  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">💪Health Style</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">

      <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">

          <a class="nav-link" href="index.html">Inicio</a>
          <a class="nav-link" href="sobre.html">Sobre</a>

          <a class="nav-link" href="dados.html">Dados</a>
          <a class="nav-link active" aria-current="page" href="contato.html">Contato</a>
        </div>
      </div>
    </div>
  </nav>

  <h4 class="text-center text-light py-3 mb-0">Preenchimento do Formulário📝</h4>

  <main class="container flex-grow-1 pb-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="bg-light rounded p-3 p-md-4">
          <form class="row g-3">
            <div class="col-12 col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="telefone" class="form-label">Telefone</label>
              <input type="tel" class="form-control" id="telefone" required>
            </div>
            <div class="col-6 col-md-3">
              <label for="cep" class="form-label">CEP</label>
              <input type="text" class="form-control" id="cep" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="pais" class="form-label">País</label>
              <select class="form-select" id="pais" required>
                <option selected disabled value="">Selecione o país onde você mora...</option>
                <option>Brasil</option>
                <option>Inglaterra</option>
                <option>Canadá</option>
                <option>Estados Unidos</option>
                <option>França</option>
                <option>Paises Baixos</option>
                <option>Argentina</option>
              </select>
            </div>
            <div class="col-12">
              <label for="assunto" class="form-label">Assunto</label>
              <input type="text" class="form-control form-control-lg" id="assunto" required>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="termos" required>
                <label class="form-check-label" for="termos">
                  Aceito os termos e condições
                </label>
              </div>
            </div>
            <div class="col-12">
              <button class="btn btn-primary w-100 w-md-auto" type="submit">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="row justify-content-center mt-4">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card" id="aviso">
          <div class="card-body bg-warning rounded">
            <h5 class="card-title text-center">AVISO IMPORTANTE!</h5>
            <p class="card-text text-center"><strong>Armazenamos suas informações em ambientes seguros e com acesso
                restrito, alinhados com a Lei Geral de Proteção de Dados (LGPD).</strong></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="card-body bg-light w-100" id="foot1">
    <p class="card-text text-center mb-0">&copy; 2026 Health Style. Todos Os Direitos Reservados</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
</body>

</html>
