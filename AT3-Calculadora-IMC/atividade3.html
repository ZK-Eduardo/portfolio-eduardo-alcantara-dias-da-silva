<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>IMC</title>
</head>

<body>
   <div class="container">
        <h1>Calculadora IMC 📊</h1>
        <input type="number" placeholder="Digite sua altura (ex: 1.75)" id="altura" step="0.01">
        <input type="number" placeholder="Digite seu peso (ex: 70)" id="peso" step="0.1">
        <button type="button" onclick="calcular()">Calcular</button>
        <p id="mensagem"></p>
    </div>

    <script>
        function calcular() {
            var peso = Number(document.getElementById("peso").value);
            var altura = Number(document.getElementById("altura").value);

            if (!peso || !altura || peso <= 0 || altura <= 0) {
                document.getElementById("mensagem").innerHTML = "Por favor, preencha todos os campos com valores válidos!";
                return;
            }

            var imc = peso / (altura * altura);
            var texto = "";

            if (imc < 18.5) {
                texto = `IMC: ${imc.toFixed(2)} - Abaixo do peso`;
            } else if (imc < 25.0) {
                texto = `IMC: ${imc.toFixed(2)} - Peso normal`;
            } else if (imc < 30.0) {
                texto = `IMC: ${imc.toFixed(2)} - Sobrepeso`;
            } else if (imc < 35.0) {
                texto = `IMC: ${imc.toFixed(2)} - Obesidade Grau 1`;
            } else if (imc < 40.0) {
                texto = `IMC: ${imc.toFixed(2)} - Obesidade Grau 2`;
            } else {
                texto = `IMC: ${imc.toFixed(2)} - Obesidade Grau 3`;
            }

            document.getElementById("mensagem").innerHTML = texto;
        }
    </script>
</body>

</html>
